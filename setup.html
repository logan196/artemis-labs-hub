<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Enroll · Artemis hub</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/marks/artemis_mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<style>
  .wrap{max-width:560px;margin:8vh auto;padding:0 20px;display:flex;flex-direction:column;gap:18px}
  textarea,input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:12px;border:1px solid var(--line-h);background:var(--card);color:var(--snow);font:400 12.5px/1.5 var(--mono,monospace)}
  textarea{min-height:140px}
  .err{color:#f08c8c;font-size:13px;min-height:1.2em}
  .ok{color:#8ce0b0;font-size:13px}
  label{font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<main class="wrap">
  <div><p class="over" style="color:var(--dim);font-size:12px;letter-spacing:.12em;text-transform:uppercase">One-time setup</p>
  <h1 style="margin:.2em 0">Enroll Touch ID</h1>
  <p style="color:var(--dim);font-size:14px;margin:0">Creates a passkey for this domain, evaluates its PRF secret, and wraps the hub master key with it. Everything runs in this tab; nothing is transmitted. The output below gets committed as <code>data/keywrap.json</code>.</p></div>
  <div>
    <label for="mk">Master key (64 hex chars, from <code>~/.artemis/hub-master-key</code>)</label>
    <input id="mk" type="password" autocomplete="off" spellcheck="false" placeholder="paste master key">
  </div>
  <button class="btn" id="go" type="button">Create passkey &amp; wrap key</button>
  <p class="err" id="err"></p>
  <div id="out" hidden>
    <p class="ok">Passkey enrolled. Commit this as <code>data/keywrap.json</code>:</p>
    <textarea id="kw" readonly></textarea>
    <button class="btn" id="copy" type="button" style="margin-top:8px">Copy JSON</button>
  </div>
</main>
<script type="module">
import * as LOCK from "./assets/lock.js";
const $ = (s) => document.querySelector(s);
$("#go").onclick = async () => {
  $("#err").textContent = "";
  const h = $("#mk").value.trim().toLowerCase();
  if (!/^[0-9a-f]{64}$/.test(h)) { $("#err").textContent = "Master key must be 64 hex characters."; return; }
  try {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: "Artemis Hub" },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "founder@artemislabs.bio", displayName: "Founder" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" },
        timeout: 60000,
        extensions: { prf: {} },
      },
    });
    if (!cred.getClientExtensionResults()?.prf?.enabled) {
      $("#err").textContent = "This authenticator did not enable the PRF extension — try Safari 18+ or Chrome 132+ with an iCloud Keychain passkey.";
      return;
    }
    const credId = LOCK.b64.enc(cred.rawId);
    const prfSalt = LOCK.b64.enc(crypto.getRandomValues(new Uint8Array(32)));
    const prf = await LOCK.assertPRF({ credId, prfSalt });   // second Touch ID tap evaluates PRF
    const kek = await LOCK.deriveKEK(prf);
    const { wrapIv, wrappedKey } = await LOCK.wrapMaster(kek, LOCK.hex.dec(h));
    const kwJson = JSON.stringify({ v: 1, credId, prfSalt, wrapIv, wrappedKey }, null, 1);
    // Round-trip check before showing anything.
    const back = await LOCK.unwrapMaster(await LOCK.deriveKEK(await LOCK.assertPRF({ credId, prfSalt })), { wrapIv, wrappedKey });
    if (LOCK.hex.enc(back) !== h) { $("#err").textContent = "Round-trip verification failed — not saving."; return; }
    $("#kw").value = kwJson;
    $("#out").hidden = false;
  } catch (e) {
    $("#err").textContent = `Enrollment failed: ${e?.message || e}`;
  }
};
$("#copy").onclick = async () => { await navigator.clipboard.writeText($("#kw").value); $("#copy").textContent = "Copied"; };
</script>
</body>
</html>
